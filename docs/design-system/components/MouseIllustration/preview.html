<!-- @dsCard group="Buttons pane" height=220 subtitle="Idle · selected · pressed" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MouseIllustration — preview</title>
<style>
  body { margin:0; padding:var(--space-14); background:var(--control-background); font-family:var(--font-sans); display:flex; gap:var(--space-24); }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:var(--space-8); }
  .mouse { position:relative; width:140px; height:170px; }
  .body { position:absolute; left:24px; top:0; width:110px; height:170px; box-sizing:border-box; border-radius:var(--radius-pill); background:var(--quaternary-fill); border:1px solid var(--mouse-outline); }
  .split { position:absolute; left:78px; top:10px; width:1px; height:60px; background:var(--mouse-split); }
  .buttons { position:absolute; left:12px; top:62px; display:flex; flex-direction:column; gap:var(--space-8); }
  .btn { width:var(--side-button-width); height:var(--side-button-height); box-sizing:border-box; border-radius:var(--radius-side-button); background:var(--side-button-idle); }
  .selected { box-shadow:0 0 0 2px var(--accent) inset; }
  .pressed { background:var(--accent); }
  figcaption { color:var(--secondary-label); }
</style></head>
<body>
  <figure><div class="mouse"><div class="body"></div><div class="split"></div><div class="buttons"><div class="btn"></div><div class="btn"></div></div></div><figcaption class="caption">No selection</figcaption></figure>
  <figure><div class="mouse"><div class="body"></div><div class="split"></div><div class="buttons"><div class="btn"></div><div class="btn selected"></div></div></div><figcaption class="caption">Back selected</figcaption></figure>
  <figure><div class="mouse"><div class="body"></div><div class="split"></div><div class="buttons"><div class="btn"></div><div class="btn selected pressed"></div></div></div><figcaption class="caption">Back pressed</figcaption></figure>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>ShortcutRecorder — preview</title>
<style>
  body { margin:0; padding:var(--space-14); background:var(--control-background); font-family:var(--font-sans); display:flex; gap:var(--space-14); align-items:center; }
  .push { font:inherit; padding:3px 10px; border-radius:6px; border:1px solid var(--separator); background:var(--control-background); color:var(--label); box-shadow:0 0.5px 1px var(--separator); }
  .push:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
  .shortcut { font-family:var(--font-mono); }
</style></head>
<body>
  <button class="push shortcut" type="button">⌘C</button>
  <button class="push shortcut" type="button">⌃⌥⇧⌘C</button>
  <button class="push shortcut" type="button">Press a shortcut…</button>
</body>
</html>

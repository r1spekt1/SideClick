<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusIndicator — preview</title>
<style>
  body { margin:0; padding:var(--space-14); background:var(--popover-background); font-family:var(--font-sans); display:flex; gap:var(--space-24); }
  .status { display:flex; align-items:center; gap:6px; }
  .dot { width:var(--status-dot); height:var(--status-dot); border-radius:var(--radius-pill); }
  .on { background:var(--status-connected); }
  .off { background:var(--status-disconnected); }
  .word { color:var(--secondary-label); }
</style></head>
<body>
  <div class="status"><span class="dot on"></span><span class="caption word">Povezan</span></div>
  <div class="status"><span class="dot off"></span><span class="caption word">Nije povezan</span></div>
</body>
</html>

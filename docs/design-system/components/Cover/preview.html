<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>XiaomiMouseFix</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--window-background); color:var(--label); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* top-band skeleton: the name is wider than 440px even at 64px */
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .accent { fill:var(--accent); }
  .ink { fill:var(--label); }
  .tint { fill:var(--secondary-label); }
  .signal { fill:var(--status-connected); }
  .key { fill:var(--on-accent); }
  .pressed { fill:var(--accent); }
  .group { rx:var(--radius-group); }
  .button { rx:var(--radius-side-button); }
  .words { position:absolute; left:var(--space-24); right:var(--space-24); bottom:var(--space-24); }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--label); }
  .tag { margin:var(--space-8) 0 0 3px; font-size:14px; line-height:20px; color:var(--secondary-label); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      accent 448×112 bled off the top-left (the one identity hue, largest) · label (ink) 224×112 · secondary-label tint 240×112 bled off the right · status-connected disc 24 once (it only ever means "connected")
  arrangement a strip of unequal bands across the top, space-14 gutters, because the popover and the settings window both stack horizontal rows
  pattern     side-button tiles, from "MouseIllustration: side buttons 20×32 on the left edge, pressed fills accent": the two-button pair cut into the accent slab in on-accent, and a row of eight tiles on the tint at a 28px pitch (side-button-width + space-8), two of them pressed in accent
  scales      tiles side-button-width × side-button-height with radius-side-button; gutters space-14; pitch side-button-width + space-8; block corners radius-group; disc radius-pill
-->
<rect class="accent group" x="-12" y="-12" width="460" height="124" rx="10"/>
<rect class="key button" x="24" y="16" width="20" height="32" rx="4"/>
<rect class="key button" x="24" y="56" width="20" height="32" rx="4"/>
<rect class="ink group" x="462" y="0" width="224" height="112" rx="10"/>
<circle class="signal" cx="660" cy="26" r="12"/>
<rect class="tint group" x="700" y="0" width="272" height="112" rx="10"/>
<rect class="key button" x="716" y="40" width="20" height="32" rx="4"/>
<rect class="key button" x="744" y="40" width="20" height="32" rx="4"/>
<rect class="pressed button" x="772" y="40" width="20" height="32" rx="4"/>
<rect class="key button" x="800" y="40" width="20" height="32" rx="4"/>
<rect class="key button" x="828" y="40" width="20" height="32" rx="4"/>
<rect class="pressed button" x="856" y="40" width="20" height="32" rx="4"/>
<rect class="key button" x="884" y="40" width="20" height="32" rx="4"/>
<rect class="key button" x="912" y="40" width="20" height="32" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">XiaomiMouseFix</h1>
<p class="tag">Side dugmad, pointer i scroll za Xiaomi Silent Mouse 2, u izgledu samog macOS-a.</p>
</div>
</div>
</body>
</html>
